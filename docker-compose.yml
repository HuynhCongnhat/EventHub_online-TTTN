services:

  postgres:
    image: postgres:16
    container_name: eventhub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: eventhub_auth
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub123


    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub -d eventhub_auth"]
      interval: 5s
      timeout: 5s
      retries: 10


  authservice:
    build:
      context: .
      dockerfile: src/EventHub.AuthService/Dockerfile

    container_name: eventhub-authservice
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      EmailSettings__Username: ${EVENTHUB_EMAIL_USERNAME}
      EmailSettings__Password: ${EVENTHUB_EMAIL_PASSWORD}

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=eventhub_auth;Username=eventhub;Password=eventhub123"

    ports:
      - "5001:8080"

  eventservice:
    build:
      context: .
      dockerfile: src/EventHub.EventService/Dockerfile
    container_name: eventhub-eventservice
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=eventhub_event;Username=eventhub;Password=eventhub123"
    ports:
      - "5002:8080"

  apigateway:
    build:
      context: .
      dockerfile: src/EventHub.ApiGateway/Dockerfile

    container_name: eventhub-apigateway
    restart: unless-stopped

    depends_on:
      - authservice

    ports:
      - "5000:8080"

  web:
    build:
      context: .
      dockerfile: src/EventHub.Web/Dockerfile

    container_name: eventhub-web
    restart: unless-stopped

    depends_on:
      - apigateway

    ports:
      - "5086:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eventhub-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:8080
    depends_on:
      - web

volumes:
  postgres_data: